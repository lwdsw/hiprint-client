<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <title>打印窗口</title>
  </head>

  <body>
    <div id="printElement"></div>
    <script>
      const { ipcRenderer } = require("electron");
      const fs = require("fs");
      const { fileURLToPath } = require("url");

      window.$ = window.jQuery = require("jquery");
      window.autoConnect = false;

      window.Nzh = require("nzh");

      window["bwip-js"] = require("bwip-js");

      window.JsBarcode = require("jsbarcode");

      window.template = undefined;

      window.io = () => {};

      // 用于判断是否为打包版本
      const isPackaged = location.href.includes("app.asar");
      // 用于判断当前系统
      const platform = process.platform;

      // 获取模板json. string或者json 统一处理
      const getTemplateJson = (val) => {
        try {
          let template = val;
          if ("string" == typeof template) {
            template = JSON.parse(template);
          }
          if ("object" != typeof template) {
            throw new Error("模板格式错误");
          }
          if (template.panels && template.panels.length === 0) {
            throw new Error("模板格式错误");
          }
          return template;
        } catch (error) {
          ipcRenderer.send("showMessageBox", {
            title: "模板格式错误",
            message: `请传入正确的模板json`,
            type: "error",
            buttons: ["我知道了"],
          });
        }
      };

      const dataUriToUint8Array = (dataUri) => {
        const base64 = `${dataUri || ""}`.split(",").pop() || "";
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      };

      const normalizeDemoAssetUrl = (value, pluginDir) => {
        if (typeof value !== "string") return value;
        const rootUrl = new URL(`${pluginDir}/vendor/assets/`, window.location.href).href;
        return value.replace(/\/demo\/vendor\/assets\//g, rootUrl);
      };

      const normalizeDemoAssetUrls = (html, pluginDir) => {
        return normalizeDemoAssetUrl(normalizePrintableHtml(html), pluginDir);
      };

      const normalizePrintableHtml = (html) => {
        if (html == null) return "";
        if (html.jquery && html[0]) return html[0].outerHTML || html[0].innerHTML || "";
        if (html instanceof Element) return html.outerHTML || html.innerHTML || "";
        const value = `${html}`;
        if (value === "undefined" || value === "null") return "";
        return value;
      };


      const cssLengthToPx = (value) => {
        if (!value) return 0;
        const text = String(value).trim();
        if (!text || text === "auto" || text.endsWith("%")) return 0;
        const numberValue = parseFloat(text);
        if (!Number.isFinite(numberValue)) return 0;
        if (text.endsWith("pt")) return (numberValue * 96) / 72;
        if (text.endsWith("mm")) return (numberValue * 96) / 25.4;
        if (text.endsWith("cm")) return (numberValue * 96) / 2.54;
        if (text.endsWith("in")) return numberValue * 96;
        return numberValue;
      };

      const resolvePercentLength = (value, parentSize) => {
        if (!value || !String(value).trim().endsWith("%")) return 0;
        const percent = parseFloat(value);
        if (!Number.isFinite(percent)) return 0;
        return (parentSize * percent) / 100;
      };

      const getElementCanvasSize = (element) => {
        if (!element) return { width: 1, height: 1 };
        const rect = element.getBoundingClientRect?.();
        let width = rect && rect.width ? rect.width : 0;
        let height = rect && rect.height ? rect.height : 0;
        width ||= cssLengthToPx(element.style?.width);
        height ||= cssLengthToPx(element.style?.height);
        const computed = window.getComputedStyle ? window.getComputedStyle(element) : undefined;
        width ||= cssLengthToPx(computed?.width);
        height ||= cssLengthToPx(computed?.height);
        if ((!width || !height) && element.parentElement) {
          const parentSize = getElementCanvasSize(element.parentElement);
          width ||= resolvePercentLength(element.style?.width || computed?.width, parentSize.width);
          height ||= resolvePercentLength(element.style?.height || computed?.height, parentSize.height);
          width ||= parentSize.width;
          height ||= parentSize.height;
        }
        return { width: width || 1, height: height || 1 };
      };

      const getSvgCanvasSize = (svg) => {
        const svgWidth = cssLengthToPx(svg.getAttribute("width") || svg.style.width);
        const svgHeight = cssLengthToPx(svg.getAttribute("height") || svg.style.height);
        const parentSize = getElementCanvasSize(svg.parentElement);
        return {
          width: Math.max(1, Math.round(svgWidth || parentSize.width || 1)),
          height: Math.max(1, Math.round(svgHeight || parentSize.height || 1)),
        };
      };

      const renderSvgToCanvas = async (svg, canvas, size) => {
        const clonedSvg = svg.cloneNode(true);
        clonedSvg.setAttribute("width", `${size.width}`);
        clonedSvg.setAttribute("height", `${size.height}`);
        if (!clonedSvg.getAttribute("preserveAspectRatio")) {
          clonedSvg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
        const source = new XMLSerializer().serializeToString(clonedSvg);
        const context = canvas.getContext("2d");
        const canvgRuntime = window.canvg || (typeof canvg !== "undefined" ? canvg : undefined);
        const CanvgCtor = canvgRuntime?.Canvg || canvgRuntime?.default;
        if (CanvgCtor?.fromString && context) {
          const renderer = CanvgCtor.fromString(context, source, {
            ignoreDimensions: true,
            ignoreAnimation: true,
            ignoreMouse: true,
          });
          await renderer.render();
          return;
        }
        if (typeof canvgRuntime === "function") {
          canvgRuntime(canvas, source, {
            ignoreDimensions: true,
            ignoreAnimation: true,
            ignoreMouse: true,
          });
          return;
        }
        throw new Error("canvg is not defined");
      };

      const svg2canvas = async (target) => {
        const tasks = [];
        target.querySelectorAll("svg").forEach((svg) => {
          const parent = svg.parentNode;
          const size = getSvgCanvasSize(svg);
          const canvas = document.createElement("canvas");
          canvas.width = size.width;
          canvas.height = size.height;
          canvas.style.width = `${size.width}px`;
          canvas.style.height = `${size.height}px`;
          parent.insertBefore(canvas, svg);
          parent.removeChild(svg);
          tasks.push(renderSvgToCanvas(svg, canvas, size));
        });
        await Promise.all(tasks);
      };

      const normalizeTemplateAssetUrls = (template, pluginDir) => {
        if (Array.isArray(template)) {
          return template.map((item) => normalizeTemplateAssetUrls(item, pluginDir));
        }
        if (template && typeof template === "object") {
          Object.keys(template).forEach((key) => {
            template[key] = normalizeTemplateAssetUrls(template[key], pluginDir);
          });
          return template;
        }
        return normalizeDemoAssetUrl(template, pluginDir);
      };

      const createPdfDataUriFromHtml = async (html, data) => {
        const JsPdfCtor = window.jsPDF || window.jspdf?.jsPDF;
        const html2canvasFactory = window.html2canvas;
        if (!JsPdfCtor) throw new Error("jsPDF is not defined");
        if (!html2canvasFactory) throw new Error("html2canvas is not defined");
        const printableHtml = normalizePrintableHtml(html);
        if (!printableHtml.trim()) throw new Error("HTML 内容为空，无法生成 PDF");

        const widthPt = data.widthPt || 595.28;
        const heightPt = data.heightPt || 841.89;
        const container = document.createElement("div");
        container.style.position = "fixed";
        container.style.left = "-100000px";
        container.style.top = "0";
        container.style.margin = "0";
        container.innerHTML = printableHtml;
        document.body.appendChild(container);

        try {
          await svg2canvas(container);
        const paper = container.querySelector(".hiprint-printPaper");
          const target =
            container.querySelector(".hiprint-printTemplate") ||
            container.querySelector(".hiprint-printPanel") ||
            paper ||
            Array.from(container.children).find(
              (child) => !["STYLE", "LINK", "SCRIPT"].includes(child.tagName),
            ) ||
            container;
          const pageCount = Math.max(
            1,
            container.querySelectorAll(".hiprint-printPaper").length,
          );
          const paperRect = (paper || target).getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          if (!paperRect.width || !paperRect.height || !targetRect.width || !targetRect.height) {
            throw new Error(
              `HTML 渲染尺寸异常，无法生成 PDF：target=${target.tagName}.${target.className || ""}, width=${targetRect.width}, height=${targetRect.height}`,
            );
          }
          const pdf = new JsPdfCtor({
            orientation: data.landscape ? "landscape" : "portrait",
            unit: "pt",
            format: data.pageSize ? `${data.pageSize}`.toLowerCase() : "a4",
          });
          const canvas = await html2canvasFactory(target, {
            scale: data.pdfScale || 2,
            width: paperRect.width || target.scrollWidth,
            x: Math.floor(targetRect.left),
            y: Math.floor(targetRect.top),
            useCORS: true,
          });
          const context = canvas.getContext("2d");
          context.mozImageSmoothingEnabled = false;
          context.webkitImageSmoothingEnabled = false;
          context.msImageSmoothingEnabled = false;
          context.imageSmoothingEnabled = false;
          const image = canvas.toDataURL("image/jpeg");
          if (!image || image === "data:,") {
            throw new Error(
              `HTML canvas 导出失败，无法生成 PDF：canvas=${canvas.width}x${canvas.height}`,
            );
          }
          for (let pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
            pdf.addImage(
              image,
              "JPEG",
              0,
              0 - pageIndex * heightPt,
              widthPt,
              pageCount * heightPt,
            );
            if (pageIndex < pageCount - 1) pdf.addPage();
          }
          return pdf.output("datauristring");
        } finally {
          document.body.removeChild(container);
        }
      };

      $(document).ready(function() {
        const loadScript = (src) => {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.setAttribute("type", "text/javascript");
            script.setAttribute("src", src);
            script.onload = resolve;
            script.onerror = () => reject(new Error(`无法加载脚本：${src}`));
            document.head.append(script);
          });
        };

        const loadStyle = (href, media) => {
          return new Promise((resolve, reject) => {
            const link = document.createElement("link");
            link.setAttribute("rel", "stylesheet");
            link.setAttribute("type", "text/css");
            link.setAttribute("href", href);
            if (media) link.setAttribute("media", media);
            link.onload = resolve;
            link.onerror = () => reject(new Error(`无法加载样式：${href}`));
            document.head.append(link);
          });
        };

        const loadBrowserScript = (src) => {
          return new Promise((resolve, reject) => {
            try {
              const scriptUrl = new URL(src, window.location.href);
              if (scriptUrl.protocol !== "file:") {
                loadScript(src).then(resolve).catch(reject);
                return;
              }
              const code = fs.readFileSync(fileURLToPath(scriptUrl), "utf8");
              window.eval(
                `(function(){var module=undefined;var exports=undefined;var define=undefined;\n${code}\n}).call(window);`,
              );
              resolve();
            } catch (error) {
              reject(error);
            }
          });
        };

        let pluginDir = "../plugin";

        // 打包版本路径特殊处理
        if (isPackaged) {
          pluginDir = "../../plugin";
        }

        const hiprintCssSrc = `${pluginDir}/hiprint.css`;
        const printLockCssSrc = `${pluginDir}/print-lock.css`;

        const loadHiprint = () => {
          hiprint = window.hiprint;

          if (!hiprint) {
            ipcRenderer.send("showMessageBox", {
              title: "插件加载错误",
              message: "无法从内置插件中获取 hiprint 对象！",
              type: "error",
              buttons: ["我知道了"],
            });
            return;
          }

          ipcRenderer.on("png", (event, data) => {
            // 滚动窗口滚动条到左上角
            window.scrollTo(0, 0);
            let html = data.html;
            if (data.template) {
              const template = normalizeTemplateAssetUrls(data.template, pluginDir);
              window.template = new hiprint.PrintTemplate({
                template,
              });
              html = window.template.getHtml(data.data);
              html = normalizeDemoAssetUrls(html, pluginDir);
            }
            const printElement = $("#printElement");
            printElement.html(html);
            const rects = Array.from(
              printElement.find(".hiprint-printPaper"),
            ).map((el) => el.getBoundingClientRect());
            const capturePageData = {
              ...data,
              templateId: data.templateId || template.id,
              x: rects[0].x,
              y: rects[0].y,
              width: rects[0].width,
              height: rects.pop().bottom,
            };
            setTimeout(() => {
              ipcRenderer.send("capturePage", capturePageData);
            });
          });

          ipcRenderer.on("pdf", (event, data) => {
            let html = data.html;
            if (data.template) {
              let template = normalizeTemplateAssetUrls(
                getTemplateJson(data.template),
                pluginDir,
              );
              window.template = new hiprint.PrintTemplate({
                template: template,
              });
              window.template
                .toPdfDataUri(data.data, data.pdfOptions)
                .then((pdfDataUri) => {
                  ipcRenderer.send("renderPdfBlob", {
                    ...data,
                    type: "blob_pdf",
                    pdf_blob: dataUriToUint8Array(pdfDataUri),
                    templateId: data.templateId || template.id,
                    pageNum: window.template.printPanels.length,
                  });
                })
                .catch((error) => {
                  ipcRenderer.send("renderPdfBlob", {
                    ...data,
                    templateId: data.templateId || template.id,
                    pdfGenerateError:
                      error && error.message ? error.message : String(error),
                  });
                });
              return;
            }
            html = normalizeDemoAssetUrls(html, pluginDir);
            createPdfDataUriFromHtml(html, data)
              .then((pdfDataUri) => {
                ipcRenderer.send("renderPdfBlob", {
                  ...data,
                  type: "blob_pdf",
                  pdf_blob: dataUriToUint8Array(pdfDataUri),
                  pageNum: Math.max(
                    1,
                    $(html).find(".hiprint-printPaper").length,
                  ),
                });
              })
              .catch((error) => {
                ipcRenderer.send("renderPdfBlob", {
                  ...data,
                  pdfGenerateError:
                    error && error.message ? error.message : String(error),
                });
              });
          });

          ipcRenderer.on("print", (event, data) => {
            let html = data.html;
            if (data.template) {
              let template = normalizeTemplateAssetUrls(
                getTemplateJson(data.template),
                pluginDir,
              );
              window.template = new hiprint.PrintTemplate({
                template: template,
              });
              window.template
                .toPdfDataUri(data.data, data.pdfOptions)
                .then((pdfDataUri) => {
                  ipcRenderer.send("print", {
                    ...data,
                    type: "blob_pdf",
                    pdf_blob: dataUriToUint8Array(pdfDataUri),
                    templateId: data.templateId || template.id,
                    pageNum: window.template.printPanels.length,
                  });
                })
                .catch((error) => {
                  ipcRenderer.send("print", {
                    ...data,
                    templateId: data.templateId || template.id,
                    pdfGenerateError:
                      error && error.message ? error.message : String(error),
                  });
                });
              return;
            }
            html = normalizeDemoAssetUrls(html, pluginDir);
            createPdfDataUriFromHtml(html, data)
              .then((pdfDataUri) => {
                ipcRenderer.send("print", {
                  ...data,
                  type: "blob_pdf",
                  pdf_blob: dataUriToUint8Array(pdfDataUri),
                  pageNum: Math.max(
                    1,
                    $(html).find(".hiprint-printPaper").length,
                  ),
                });
              })
              .catch((error) => {
                ipcRenderer.send("print", {
                  ...data,
                  pdfGenerateError:
                    error && error.message ? error.message : String(error),
                });
              });
          });
        };
        Promise.all([
          loadStyle(hiprintCssSrc),
          loadStyle(printLockCssSrc),
          loadStyle(printLockCssSrc, "print"),
        ])
          .then(() => loadBrowserScript(`${pluginDir}/jspdf/canvg.min.js`))
          .then(() =>
            loadBrowserScript(`${pluginDir}/jspdf/html2canvas.min.js`),
          )
          .then(() => loadBrowserScript(`${pluginDir}/jspdf/jspdf.min.js`))
          .then(() => loadBrowserScript(`${pluginDir}/vendor/JsBarcode.all.min.js`))
          .then(() => loadBrowserScript(`${pluginDir}/vendor/qrcode.js`))
          .then(() => loadScript(`${pluginDir}/hiprint.build.js`))
          .then(loadHiprint)
          .catch((error) => {
            ipcRenderer.send("showMessageBox", {
              title: "插件加载错误",
              message:
                error && error.message
                  ? error.message
                  : "无法加载内置 hiprint 插件！",
              type: "error",
              buttons: ["我知道了"],
            });
          });
      });
    </script>
  </body>
</html>
