<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ArcoPrint</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./element-ui/index.css" />
    <script src="./js/vue.min.js"></script>
    <script src="./element-ui/index.js"></script>
  </head>

  <body>
    <div id="app" class="box">
      <div class="background">
        <div class="bg-primary" :class="{active: !transitActiveFlag}"></div>
        <div
          class="bg-success"
          :class="{active: socketActiveNum || transitActiveFlag}"
        ></div>
        <div class="bg-warning" :class="{active: printing}"></div>
      </div>
      <div class="container">
        <div class="header">
          <div class="summary">
            <div class="title">打印服务已启动</div>
            <div class="service-address">
              服务地址：
              <span data-prop="ipAddress" @click="handleCopy">{{ ipAddress }}</span>
            </div>
          </div>
          <button class="settings-button" title="进入设置" @click="openSetting">
            <i class="el-icon-setting"></i>
          </button>
        </div>
        <div class="status">
          <div class="status-item">
            <span class="label">中转</span>
            <span class="dot" :class="{ active: transitActiveFlag }"></span>
            <span>{{ transitActiveFlag ? '已连接' : '未连接' }}</span>
          </div>
          <div class="status-item">
            <span class="label">本地</span>
            <span class="dot" :class="{ active: socketActiveNum }"></span>
            <span>{{ socketActiveNum ? `已连接 ${socketActiveNum} 条` : '未连接' }}</span>
          </div>
          <div class="status-item">
            <span class="label">打印</span>
            <span class="dot" :class="{ active: printing }"></span>
            <span>{{ printing ? "打印中" : "空闲" }}</span>
          </div>
        </div>
      </div>
    </div>
    <script type="text/javascript">
      const { ipcRenderer, clipboard } = require("electron");
      const Store = require("electron-store");
      const store = new Store();

      const { version } = require("../package.json");

      document.title = store.get("mainTitle") || "ArcoPrint";

      let ipc = ipcRenderer;
      new Vue({
        el: "#app",
        data: () => {
          return {
            ipAddress: "",
            transitActiveFlag: false,
            socketActiveNum: 0,
            printing: false,
            version,
          };
        },
        created() {
          ipc.send("getAddress");
          ipc.on("address", (event, arg) => {
            this.ipAddress = `http://${arg.ip}:${arg.port || 17521}`;
          });
          ipc.on("serverConnection", this.socketActive);
          ipc.on("printTask", (event, arg) => {
            this.printing = arg;
          });
          ipc.on("clientConnection", this.transitActive);
        },
        methods: {
          openSetting() {
            ipc.send("openSetting");
          },
          handleCopy(event) {
            clipboard.writeText(this[event.target.dataset.prop]);
            ipc.send("notification", {
              title: "复制成功",
              body: "文本已成功复制到剪贴板中！",
            });
          },
          socketActive(evnet, arg) {
            this.socketActiveNum = arg;
          },
          transitActive(event, arg) {
            this.transitActiveFlag = arg;
          },
        },
      });
    </script>
  </body>
</html>
